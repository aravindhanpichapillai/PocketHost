plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pockethost'
    compileSdk 35
    defaultConfig {
        applicationId 'com.pockethost'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'com.google.zxing:core:3.5.3'
}
